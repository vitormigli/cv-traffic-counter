[project]
name = "cv-traffic-counter"
version = "0.1.0"
description = "YOLOv8 + tracking traffic/pedestrian counter and zone-alert system, built with OpenCV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "ultralytics>=8.3",
    "numpy>=1.26",
    "lap>=0.5.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
cv-traffic-counter = "cv_traffic_counter.cli:main"
cv-traffic-counter-web = "cv_traffic_counter.web:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_traffic_counter"]
artifacts = ["*.yaml"]
