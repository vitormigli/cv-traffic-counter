name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests — pure line-crossing/zone-alert logic, no model or video
        run: uv run pytest -q

      - name: Download demo video
        run: uv run python scripts/download_demo_video.py

      - name: Eval — real YOLOv8n + ByteTrack inference against ground truth
        run: uv run python evals/run_eval.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Full-history scan via the CLI directly, not gitleaks-action's push-event
      # diffing — that diffs before..after SHAs from the push event, which
      # breaks on a repo's first push (the initial commit has no parent to
      # diff against). A full `detect` over the whole repo sidesteps that.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full repository history
        run: gitleaks detect --source . -v
